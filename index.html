  <script>
// ============== CONFIG ==============
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwoG9yzqq0mO3uc4GrHKK_rJ3pV1-8kmRPKUe_vhoK29DVV4DSMdxjsVVzlQxeumbY1/exec';

let currentUser = null;
let materials = [];
let products = [];
let currentPage = 'dashboard';

// ============== COOKIE HELPERS ==============
function setCookie(name, val, days=365) {
  const d = new Date(); d.setTime(d.getTime()+(days*86400000));
  document.cookie = name+'='+encodeURIComponent(val)+';expires='+d.toUTCString()+';path=/;SameSite=Lax';
}
function getCookie(name) {
  const v = document.cookie.match('(^|;)\\s*'+name+'=([^;]*)');
  return v ? decodeURIComponent(v[2]) : null;
}
function deleteCookie(name) { document.cookie = name+'=;expires=Thu,01 Jan 1970 00:00:00 GMT;path=/'; }

// ============== TOAST ==============
function showToast(msg, type='success') {
  const c = document.getElementById('toastContainer');
  const colors = { success:'bg-mint-500', error:'bg-red-500', info:'bg-sky-500', warning:'bg-amber-500' };
  const icons = { success:'✅', error:'❌', info:'ℹ️', warning:'⚠️' };
  const t = document.createElement('div');
  t.className = `toast ${colors[type]} text-white px-5 py-3 rounded-2xl shadow-lg text-sm font-medium flex items-center gap-2 min-w-[200px]`;
  t.innerHTML = `<span>${icons[type]}</span><span>${msg}</span><div class="absolute bottom-0 left-0 h-1 bg-white/30 rounded-b-2xl progress-bar"></div>`;
  t.style.position='relative'; t.style.overflow='hidden';
  c.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

// ============== GAS API ==============
async function gasCall(params) {
  try {
    const url = GAS_URL + '?' + new URLSearchParams(params).toString();
    const r = await fetch(url);
    return await r.json();
  } catch(e) {
    console.error('GAS Error:', e);
    return { success: false, message: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้' };
  }
}

// ============== LOGIN ==============
async function doLogin() {
  const phone = document.getElementById('phoneInput').value.trim();
  if(!phone || phone.length < 9) {
    document.getElementById('loginError').textContent = 'กรุณากรอกเบอร์โทรให้ถูกต้อง';
    document.getElementById('loginError').classList.remove('hidden');
    return;
  }
  document.getElementById('loginError').classList.add('hidden');
  document.getElementById('loginBtn').disabled = true;
  document.getElementById('loginSpinner').classList.remove('hidden');

  const res = await gasCall({ action:'login', phone });
  document.getElementById('loginBtn').disabled = false;
  document.getElementById('loginSpinner').classList.add('hidden');

  if(res.success) {
    currentUser = { phone: res.phone, name: res.name };
    setCookie('user_phone', res.phone);
    setCookie('user_name', res.name);
    enterApp();
  } else {
    document.getElementById('loginError').textContent = res.message || 'เข้าสู่ระบบไม่สำเร็จ';
    document.getElementById('loginError').classList.remove('hidden');
  }
}

function enterApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('userDisplay').textContent = `👋 ${currentUser.name}`;
  loadAllData();
  navigate('dashboard');
}

function doLogout() {
  deleteCookie('user_phone');
  deleteCookie('user_name');
  currentUser = null;
  materials = [];
  products = [];
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('phoneInput').value = '';
}

// Auto login from cookie
function tryAutoLogin() {
  const phone = getCookie('user_phone');
  const name = getCookie('user_name');
  if(phone) {
    currentUser = { phone, name: name||'User' };
    enterApp();
    // Verify in background
    gasCall({action:'login', phone}).then(res=>{
      if(!res.success) { doLogout(); showToast('เซสชั่นหมดอายุ กรุณาเข้าสู่ระบบใหม่','warning'); }
    });
  }
}

document.getElementById('phoneInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

// ============== DATA LOADING ==============
async function loadAllData() {
  // Load from localStorage first (instant)
  const cachedM = localStorage.getItem('materials_'+currentUser.phone);
  const cachedP = localStorage.getItem('products_'+currentUser.phone);
  if(cachedM) materials = JSON.parse(cachedM);
  if(cachedP) products = JSON.parse(cachedP);
  renderCurrentPage();

  // Then sync from server
  const [mRes, pRes] = await Promise.all([
    gasCall({action:'getMaterials', phone:currentUser.phone}),
    gasCall({action:'getProducts', phone:currentUser.phone})
  ]);
  if(mRes.success) { materials = mRes.data; localStorage.setItem('materials_'+currentUser.phone, JSON.stringify(materials)); }
  if(pRes.success) { products = pRes.data; localStorage.setItem('products_'+currentUser.phone, JSON.stringify(products)); }
  renderCurrentPage();
}

function saveLocalData() {
  localStorage.setItem('materials_'+currentUser.phone, JSON.stringify(materials));
  localStorage.setItem('products_'+currentUser.phone, JSON.stringify(products));
}

// ============== NAVIGATION ==============
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.classList.toggle('active', b.dataset.nav===page);
    if(b.dataset.nav===page) b.classList.remove('text-gray-400');
    else b.classList.add('text-gray-400');
  });
  renderCurrentPage();
}

function renderCurrentPage() {
  const c = document.getElementById('mainContent');
  switch(currentPage) {
    case 'dashboard': c.innerHTML = renderDashboard(); break;
    case 'materials': c.innerHTML = renderMaterials(); break;
    case 'products': c.innerHTML = renderProducts(); break;
    case 'ranking': c.innerHTML = renderRanking(); break;
  }
  lucide.createIcons();
}

// ============== MODAL ==============
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.remove('hidden');
  document.getElementById('modalOverlay').classList.add('flex');
  lucide.createIcons();
}
function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalOverlay').classList.remove('flex');
}

// ============== UTILITIES ==============
function genId() { return 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,6); }
function fmt(n) { return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtInt(n) { return Number(n||0).toLocaleString('th-TH'); }

function calcDeliveryNet(price) {
  // GP 30% -> delivery gets 70% of price, then GP portion has +7% VAT
  // Net = price - GP - VATofGP
  // GP = price * 0.30
  // VAT of GP = GP * 0.07
  // Net = price - GP - VAT = price * (1 - 0.30 - 0.30*0.07) = price * (1 - 0.321)
  const gp = price * 0.30;
  const vat = gp * 0.07;
  return price - gp - vat;
}

function getProductCost(prod) {
  if(!prod.ingredients || !prod.ingredients.length) return 0;
  let total = 0;
  prod.ingredients.forEach(ing=>{
    const mat = materials.find(m=>m.id===ing.materialId);
    if(mat) {
      total += (Number(mat.price) / Number(ing.usageCount||1));
    }
  });
  return total;
}

function getProductCostPerUse(prod) {
  if(!prod.ingredients || !prod.ingredients.length) return 0;
  const totalCost = getProductCost(prod);
  const totalUses = prod.ingredients.reduce((sum, ing) => sum + (Number(ing.usageCount)||1), 0);
  return totalUses > 0 ? totalCost / totalUses : totalCost;
}

function getProductProfit(prod) {
  const cost = getProductCost(prod);
  const storeProfit = Number(prod.priceStore||0) - cost;
  const delivNet = calcDeliveryNet(Number(prod.priceDelivery||0));
  const delivProfit = delivNet - cost;
  return { cost, storeProfit, delivProfit, delivNet };
}

// ============== DASHBOARD ==============
function renderDashboard() {
  const totalMaterials = materials.length;
  const totalProducts = products.length;
  let totalCost = 0, totalStoreRevenue = 0, totalStoreProfit = 0, totalDelivProfit = 0;
  let profitData = [];

  // 1. ตั้งต้นตัวแปรเก็บสถิติแยกตามระดับกำไร (%) แบบล็อกเกณฑ์ตายตัว
  const profitByLevel = {
    high: 0,
    medium: 0,
    low: 0,
    negative: 0
  };

  products.forEach(p => {
    const info = getProductProfit(p);
    const priceStoreNum = Number(p.priceStore || 0);

    // คำนวณเปอร์เซ็นต์กำไรหน้าร้าน (%) ของสินค้าชิ้นนี้
    const storeProfitPct = priceStoreNum > 0 ? (info.storeProfit / priceStoreNum * 100) : 0;

    // คำนวณกำไรเดลิเวอรี่ที่หักต้นทุนวัตถุดิบจริง ( info.delivNet - info.cost )
    const actualDelivProfit = (info.delivNet || 0) - (info.cost || 0);

    totalCost += info.cost;
    totalStoreRevenue += priceStoreNum;
    totalStoreProfit += info.storeProfit;
    totalDelivProfit += actualDelivProfit; // สะสมยอดกำไรเดลิเวอรี่จริง

    profitData.push({ 
      name: p.name, 
      storeProfit: info.storeProfit, 
      delivProfit: actualDelivProfit, 
      cost: info.cost 
    });

    // 2. แยกกลุ่มสถิติตามเปอร์เซ็นต์กำไรหน้าร้านตรงๆ (ล้อตาม if-else หน้าการ์ดสินค้า)
    if (storeProfitPct > 0) {
      if (storeProfitPct > 50) {
        profitByLevel.high++;         // 🟢 สูง: เกิน 50%
      } else if (storeProfitPct >= 30) {
        profitByLevel.medium++;       // 🟡 ปานกลาง: 30% ถึง 50%
      } else {
        profitByLevel.low++;          // 🟠 ต่ำ: น้อยกว่า 30%
      }
    } else {
      profitByLevel.negative++;       // 🔴 ขาดทุน: น้อยกว่าหรือเท่ากับ 0
    }
  });

  // Top 5 sorted data
  const sorted = [...profitData].sort((a,b)=>b.storeProfit-a.storeProfit).slice(0,5);
  const maxProfit = sorted.length ? Math.max(...sorted.map(s=>Math.abs(s.storeProfit)),1) : 1;

  // Store vs Delivery ยอดรวมทั้งหมด (ผูกเข้ากับตัวแปรที่คำนวณวัตถุดิบจริงด้านบน)
  const storeTotal = totalStoreProfit;
  const delivTotal = totalDelivProfit;
  const maxCompare = Math.max(Math.abs(storeTotal), Math.abs(delivTotal), 1);

  return `
  <div class="slide-up space-y-4">
    <h2 class="text-xl font-bold text-gray-700 flex items-center gap-2">📊 แดชบอร์ด</h2>

    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white rounded-2xl p-4 shadow-sm card-hover border-l-4 border-brand-400">
        <div class="text-2xl mb-1">🥚</div>
        <div class="text-2xl font-bold text-brand-600">${fmtInt(totalMaterials)}</div>
        <div class="text-xs text-gray-400">วัตถุดิบ</div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm card-hover border-l-4 border-candy-400">
        <div class="text-2xl mb-1">🍰</div>
        <div class="text-2xl font-bold text-candy-600">${fmtInt(totalProducts)}</div>
        <div class="text-xs text-gray-400">สินค้า</div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm card-hover border-l-4 border-mint-400">
        <div class="text-2xl mb-1">💰</div>
        <div class="text-2xl font-bold ${totalStoreProfit>=0?'text-mint-600':'text-red-500'}">${totalStoreRevenue>0?((totalStoreProfit/totalStoreRevenue*100).toFixed(2)+'%'):'-'}</div>
        <div class="text-xs text-gray-400">กำไรหน้าร้านรวม</div>
        <div class="text-xs text-gray-500 mt-1">฿${fmt(totalStoreProfit)}</div>
      </div>
      <div class="bg-white rounded-2xl p-4 shadow-sm card-hover border-l-4 border-sky-400">
        <div class="text-2xl mb-1">📦</div>
        <div class="text-2xl font-bold ${totalDelivProfit>=0?'text-sky-600':'text-red-500'}">
          ${products.length>0?((totalDelivProfit/(products.reduce((s,p)=>s+(Number(p.priceDelivery)||0),0))*100).toFixed(2)+'%'):'-'}
        </div>
        <div class="text-xs text-gray-400">กำไรเดลิเวอรี่รวม</div>
        <div class="text-xs text-gray-500 mt-1">฿${fmt(totalDelivProfit)}</div>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <h3 class="text-sm font-semibold text-gray-500 mb-3">📈 การกระจายระดับกำไร</h3>
      <div class="grid grid-cols-4 gap-2 mb-4">
        <div class="text-center">
          <div class="text-3xl font-bold text-green-600">${profitByLevel.high}</div>
          <div class="text-xs text-gray-500 mt-1">🟢 สูง</div>
          <div class="text-[10px] text-gray-400 mt-1">&gt; 50%</div>
        </div>
        <div class="text-center">
          <div class="text-3xl font-bold text-yellow-600">${profitByLevel.medium}</div>
          <div class="text-xs text-gray-500 mt-1">🟡 ปานกลาง</div>
          <div class="text-[10px] text-gray-400 mt-1">30% - 50%</div>
        </div>
        <div class="text-center">
          <div class="text-3xl font-bold text-orange-600">${profitByLevel.low}</div>
          <div class="text-xs text-gray-500 mt-1">🟠 ต่ำ</div>
          <div class="text-[10px] text-gray-400 mt-1">&lt; 30%</div>
        </div>
        <div class="text-center">
          <div class="text-3xl font-bold text-red-600">${profitByLevel.negative}</div>
          <div class="text-xs text-gray-500 mt-1">🔴 ขาดทุน</div>
          <div class="text-[10px] text-gray-400 mt-1">&le; 0%</div>
        </div>
      </div>
      
      <div class="flex h-6 rounded-lg overflow-hidden gap-0.5 bg-gray-100">
        <div class="bg-green-500 transition-all" style="width:${totalProducts > 0 ? (profitByLevel.high / totalProducts * 100) : 0}%"></div>
        <div class="bg-yellow-500 transition-all" style="width:${totalProducts > 0 ? (profitByLevel.medium / totalProducts * 100) : 0}%"></div>

// ============== MATERIALS ==============
function renderMaterials() {
  const searchHtml = `
    <div class="flex gap-2 mb-4">
      <div class="flex-1 relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-300"><i data-lucide="search" class="w-4 h-4"></i></span>
        <input id="matSearch" oninput="filterMaterials()" placeholder="🔍 ค้นหาวัตถุดิบ..." class="w-full pl-9 pr-4 py-2.5 bg-white rounded-2xl border border-gray-200 text-sm" />
      </div>
      <button onclick="openAddMaterial()" class="bg-gradient-to-r from-brand-500 to-brand-400 text-white px-4 py-2.5 rounded-2xl font-medium text-sm shadow-md hover:shadow-lg transition active:scale-95 whitespace-nowrap">
        ➕ เพิ่ม
      </button>
    </div>`;

  const listHtml = materials.length === 0 ?
    `<div class="text-center py-12"><div class="text-5xl mb-3">🥚</div><p class="text-gray-300">ยังไม่มีวัตถุดิบ</p><p class="text-gray-300 text-sm">กดปุ่ม "เพิ่ม" เพื่อเริ่มต้น!</p></div>` :
    `<div id="matList" class="grid grid-cols-2 gap-3">${materials.map((m,i)=>{
      // Count how many products use this material
      const usageCount = products.reduce((sum, p) => {
        const ing = p.ingredients?.find(x => x.materialId === m.id);
        return sum + (ing ? 1 : 0);
      }, 0);
      // Get product names that use this material
      const productsUsing = products.filter(p => p.ingredients?.some(x => x.materialId === m.id)).map(p => p.name);
      
      const usageLevel = usageCount > 5 ? '🔥 ใช้มาก' : usageCount > 2 ? '📈 ใช้ปานกลาง' : usageCount > 0 ? '📉 ใช้น้อย' : '⭕ ไม่ใช้';
      const usageColor = usageCount > 5 ? 'bg-red-50 text-red-600' : usageCount > 2 ? 'bg-yellow-50 text-yellow-600' : usageCount > 0 ? 'bg-blue-50 text-blue-600' : 'bg-gray-50 text-gray-400';
      return `
      <div class="bg-white rounded-2xl p-4 shadow-sm card-hover slide-up flex flex-col" style="animation-delay:${i*0.05}s" data-mat-id="${m.id}" data-mat-name="${m.name.toLowerCase()}">
        <div class="flex items-center justify-between mb-3">
          <div class="w-8 h-8 bg-brand-50 rounded-lg flex items-center justify-center text-lg">🧈</div>
          <div class="flex gap-1">
            <button onclick="openEditMaterial('${m.id}')" class="p-1.5 hover:bg-brand-50 rounded-lg transition" title="แก้ไข"><i data-lucide="pencil" class="w-3.5 h-3.5 text-brand-400"></i></button>
            <button onclick="confirmDeleteMaterial('${m.id}')" class="p-1.5 hover:bg-red-50 rounded-lg transition" title="ลบ"><i data-lucide="trash-2" class="w-3.5 h-3.5 text-red-400"></i></button>
          </div>
        </div>
        <div class="flex-1">
          <div class="font-semibold text-gray-700 text-sm line-clamp-2">${m.name}</div>
          <div class="text-brand-500 font-bold text-lg mt-2">฿${fmt(m.price)}</div>
          <div class="mt-2 px-2 py-1 rounded-full inline-block text-xs font-bold ${usageColor}">
            ${usageLevel} (${usageCount})
          </div>

        </div>
      </div>`;
    }).join('')}
    </div>`;

  return `<div class="slide-up"><h2 class="text-xl font-bold text-gray-700 flex items-center gap-2 mb-4">🥚 วัตถุดิบ <span class="text-sm font-normal text-gray-400">(${materials.length} รายการ)</span></h2>${searchHtml}${listHtml}</div>`;
}

function filterMaterials() {
  const q = document.getElementById('matSearch').value.toLowerCase();
  document.querySelectorAll('[data-mat-id]').forEach(el=>{
    el.style.display = el.dataset.matName.includes(q) ? '' : 'none';
  });
}

function openAddMaterial() {
  openModal(`

      </div>

function openEditMaterial(id) {
  const m = materials.find(x=>x.id===id);
  if(!m) return;
  openModal(`
    <div class="p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-gray-700 flex items-center gap-2">✏️ แก้ไขวัตถุดิบ</h3>
        <button onclick="closeModal()" class="p-1.5 hover:bg-gray-100 rounded-lg transition" title="ปิด">
          <i data-lucide="x" class="w-5 h-5 text-gray-400"></i>
        </button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="text-sm font-medium text-gray-500 mb-1 block">ชื่อวัตถุดิบ</label>
          <input id="editMatName" value="${m.name}" class="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200" />
        </div>
        <div>
          <label class="text-sm font-medium text-gray-500 mb-1 block">ราคา (บาท)</label>
          <input id="editMatPrice" type="number" step="0.01" value="${m.price}" class="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200" />
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="updateMaterial('${id}')" class="flex-1 py-3 bg-gradient-to-r from-brand-500 to-brand-400 text-white rounded-2xl font-medium shadow-md transition active:scale-95">💾 อัปเดต</button>
      </div>
    </div>
  `);
  setTimeout(() => document.getElementById('editMatName').focus(), 100);
}

async function saveMaterial() {
  const name = document.getElementById('matName').value.trim();
  const price = document.getElementById('matPrice').value;
  if(!name) { showToast('กรุณากรอกชื่อวัตถุดิบ','warning'); return; }
  if(!price || isNaN(price)) { showToast('กรุณากรอกราคา','warning'); return; }

  const id = genId();
  const newMat = { id, name, price: Number(price) };

  // Optimistic update
  materials.push(newMat);
  saveLocalData();
  closeModal();
  renderCurrentPage();
  showToast('เพิ่มวัตถุดิบสำเร็จ! 🎉');

  // Background sync
  gasCall({ action:'addMaterial', phone:currentUser.phone, id, name, price });
}

async function updateMaterial(id) {
  const name = document.getElementById('editMatName').value.trim();
  const price = document.getElementById('editMatPrice').value;
  if(!name || !price) { showToast('กรุณากรอกข้อมูลให้ครบ','warning'); return; }

  const idx = materials.findIndex(m=>m.id===id);
  if(idx>=0) {
    materials[idx] = { id, name, price: Number(price) };
  }
  saveLocalData();
  closeModal();
  renderCurrentPage();
  showToast('อัปเดตวัตถุดิบสำเร็จ! ✨');

  gasCall({ action:'updateMaterial', id, name, price, phone:currentUser.phone });
}

function confirmDeleteMaterial(id) {
  const m = materials.find(x=>x.id===id);
  openModal(`
    <div class="p-6 text-center">
      <div class="text-5xl mb-3">🗑️</div>
      <h3 class="text-lg font-bold text-gray-700 mb-2">ลบวัตถุดิบ?</h3>
      <p class="text-gray-400 text-sm mb-4">ต้องการลบ "<strong>${m?m.name:''}</strong>" ใช่ไหม?</p>
      <div class="flex gap-3">
        <button onclick="closeModal()" class="flex-1 py-3 bg-gray-100 text-gray-500 rounded-2xl font-medium">ไม่ใช่</button>
        <button onclick="deleteMaterial('${id}')" class="flex-1 py-3 bg-red-500 text-white rounded-2xl font-medium shadow-md transition active:scale-95">🗑️ ลบเลย</button>
      </div>
    </div>
  `);
}

async function deleteMaterial(id) {
  materials = materials.filter(m=>m.id!==id);
  // Also remove from product ingredients
  products.forEach(p=>{
    if(p.ingredients) p.ingredients = p.ingredients.filter(i=>i.materialId!==id);
  });
  saveLocalData();
  closeModal();
  renderCurrentPage();
  showToast('ลบวัตถุดิบแล้ว 🗑️');
  gasCall({ action:'deleteMaterial', id, phone:currentUser.phone });
}

        ${p.ingredients && p.ingredients.length > 0 ? `
        <div class="space-y-1.5">
          ${p.ingredients
            .map(ing => {
              const mat = materials.find(m => m.id === ing.materialId);
              return mat ? {ing, mat, cost: mat.price / ing.usageCount} : null;
            })
            .filter(x => x)
            .sort((a, b) => b.cost - a.cost)
            .map((item) => {
              const totalCost = p.ingredients.reduce((sum, ing) => {
                const m = materials.find(x => x.id === ing.materialId);
                return sum + (m ? m.price / ing.usageCount : 0);
              }, 0);
              const pct = totalCost > 0 ? (item.cost / totalCost * 100) : 0;
              return `
              <div>
                <div class="flex justify-between text-xs mb-0.5">
                  <span class="font-medium text-gray-600">${item.mat.name} (${item.ing.usageCount}x)</span>
                  <span class="text-gray-500">${((fmt(item.cost) / fmt(p.priceStore)) * 100).toFixed(2)}% (฿${fmt(item.cost)})  </span>
                </div>
                <div class="w-full bg-gray-100 rounded-lg h-3 overflow-hidden">
                  <div class="h-3 rounded-lg bg-gradient-to-r from-brand-300 to-brand-500 transition-all" style="width:${pct}%"></div>
                </div>
              </div>`;
            }).join('')}
        </div>` : ''}
      </div>`;
    }).join('')}</div>`;

  return `<div class="slide-up"><h2 class="text-xl font-bold text-gray-700 flex items-center gap-2 mb-4">🍰 สินค้า <span class="text-sm font-normal text-gray-400">(${products.length} รายการ)</span></h2>${searchHtml}${listHtml}</div>`;
}

function buildIngredientSelector(existing=[]) {
  if(materials.length===0) return '<p class="text-sm text-gray-300 py-2">ยังไม่มีวัตถุดิบ กรุณาเพิ่มวัตถุดิบก่อน 🥚</p>';

  return `
    <div id="ingContainer" class="space-y-2">
      ${existing.map((ing,i)=>{
        const mat = materials.find(m=>m.id===ing.materialId);
        return `
        <div class="flex items-center gap-2 ing-row" data-ing-idx="${i}">
          <select class="ing-select flex-1 px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 text-sm">
            <option value="">เลือกวัตถุดิบ</option>
            ${materials.map(m=>`<option value="${m.id}" ${m.id===ing.materialId?'selected':''}>${m.name} (฿${fmt(m.price)})</option>`).join('')}
          </select>
          <input type="number" class="ing-count w-20 px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 text-sm text-center" value="${ing.usageCount||1}" min="1" placeholder="ครั้ง" />
          <button onclick="this.parentElement.remove()" class="p-2 hover:bg-red-50 rounded-xl"><span class="text-red-400">✕</span></button>
        </div>`;
      }).join('')}
    </div>
    <button onclick="addIngRow()" class="mt-2 text-sm text-brand-500 hover:text-brand-600 font-medium transition">➕ เพิ่มวัตถุดิบ</button>
  `;
}

function addIngRow() {
  const container = document.getElementById('ingContainer');
  const idx = container.children.length;
  const div = document.createElement('div');
  div.className = 'flex items-center gap-2 ing-row fade-in';
  div.dataset.ingIdx = idx;
  div.innerHTML = `
    <select class="ing-select flex-1 px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 text-sm">
      <option value="">เลือกวัตถุดิบ</option>
      ${materials.map(m=>`<option value="${m.id}">${m.name} (฿${fmt(m.price)})</option>`).join('')}
    </select>
    <input type="number" class="ing-count w-20 px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 text-sm text-center" value="1" min="1" placeholder="ครั้ง" />
    <button onclick="this.parentElement.remove()" class="p-2 hover:bg-red-50 rounded-xl"><span class="text-red-400">✕</span></button>
  `;
  container.appendChild(div);
}

function collectIngredients() {
  const rows = document.querySelectorAll('.ing-row');
  const ings = [];
  rows.forEach(r=>{
    const sel = r.querySelector('.ing-select');
    const cnt = r.querySelector('.ing-count');
    if(sel && sel.value) {
      ings.push({ materialId: sel.value, usageCount: Number(cnt.value)||1 });
    }
  });
  return ings;
}

async function saveProduct() {
  const name = document.getElementById('prodName').value.trim();
  const priceStore = document.getElementById('prodPriceStore').value;
  const priceDelivery = document.getElementById('prodPriceDeliv').value;
  if(!name) { showToast('กรุณากรอกชื่อสินค้า','warning'); return; }

  const ingredients = collectIngredients();
  const id = genId();
  const newProd = { id, name, priceStore:Number(priceStore||0), priceDelivery:Number(priceDelivery||0), ingredients };

  products.push(newProd);
  saveLocalData();
  closeModal();
  renderCurrentPage();
  showToast('เพิ่มสินค้าสำเร็จ! 🎉');

  gasCall({ action:'addProduct', phone:currentUser.phone, id, name, priceStore:priceStore||0, priceDelivery:priceDelivery||0, ingredients:JSON.stringify(ingredients) });
}

async function updateProduct(id) {
  const name = document.getElementById('editProdName').value.trim();
  const priceStore = document.getElementById('editProdPriceStore').value;
  const priceDelivery = document.getElementById('editProdPriceDeliv').value;
  if(!name) { showToast('กรุณากรอกชื่อสินค้า','warning'); return; }

  const ingredients = collectIngredients();
  const idx = products.findIndex(p=>p.id===id);
  if(idx>=0) {
    products[idx] = { id, name, priceStore:Number(priceStore||0), priceDelivery:Number(priceDelivery||0), ingredients };
  }
  saveLocalData();
  closeModal();
  renderCurrentPage();
  showToast('อัปเดตสินค้าสำเร็จ! ✨');

  gasCall({ action:'updateProduct', id, phone:currentUser.phone, name, priceStore:priceStore||0, priceDelivery:priceDelivery||0, ingredients:JSON.stringify(ingredients) });
}

function renderRanking() {
  if (products.length === 0) {
    return `<div class="slide-up"><h2 class="text-xl font-bold text-gray-700 flex items-center gap-2 mb-4">🏆 จัดอันดับกำไร</h2><div class="text-center py-12"><div class="text-5xl mb-3">🏆</div><p class="text-gray-300">ยังไม่มีสินค้าสำหรับจัดอันดับ</p></div></div>`;
  }

  // ปรับปรุงการ Map ข้อมูล: คำนวณกำไรสุทธิเดลิเวอรี่ที่แท้จริง (หักต้นทุนวัตถุดิบ) เอาไว้สำหรับจัดอันดับ
  const ranked = products.map(p => {
    const info = getProductProfit(p);
    const actualDelivProfit = (info.delivNet || 0) - (info.cost || 0);
    return { 
      ...p, 
      ...info, 
      actualDelivProfit: actualDelivProfit // กำไรเดลิเวอรี่สุทธิจริงหลังหักวัตถุดิบ
    };
  });

  // จัดอันดับตามกำไรที่ถูกต้อง
  const storeRank = [...ranked].sort((a, b) => b.storeProfit - a.storeProfit);
  const delivRank = [...ranked].sort((a, b) => b.actualDelivProfit - a.actualDelivProfit);

  const medals = ['🥇', '🥈', '🥉'];

  return `
  <div class="slide-up space-y-4">
    <h2 class="text-xl font-bold text-gray-700 flex items-center gap-2">🏆 จัดอันดับกำไร</h2>

    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <h3 class="font-semibold text-gray-600 mb-3 flex items-center gap-2">🏪 อันดับกำไรหน้าร้าน</h3>
      <div class="space-y-2">
        ${storeRank.map((p, i) => {
          const maxP = Math.max(Math.abs(storeRank[0].storeProfit), 1);
          const pct = (Math.abs(p.storeProfit) / maxP * 100);
          const costPct = Number(p.priceStore) > 0 ? (p.cost / Number(p.priceStore) * 100) : 0;
          const profitPct = Number(p.priceStore) > 0 ? (p.storeProfit / Number(p.priceStore) * 100) : 0;
          return `
          <div class="flex items-center gap-3">
            <span class="text-lg w-8 text-center">${i < 3 ? medals[i] : (i + 1)}</span>
            <div class="flex-1">
              <div class="flex justify-between text-sm mb-0.5">
                <span class="font-medium text-gray-700">${p.name}</span>
                <span class="${p.storeProfit >= 0 ? 'text-mint-600' : 'text-red-500'} font-bold">฿${fmt(p.storeProfit)}</span>
              </div>
              <div class="text-xs text-gray-400 mb-1">ต้นทุน ${costPct.toFixed(1)}% | กำไร ${profitPct.toFixed(1)}%</div>
              <div class="w-full bg-gray-100 rounded-full h-2">
                <div class="h-2 rounded-full transition-all duration-700 ${p.storeProfit >= 0 ? 'bg-gradient-to-r from-mint-300 to-mint-500' : 'bg-red-400'}" style="width:${Math.max(pct, 5)}%"></div>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <h3 class="font-semibold text-gray-600 mb-3 flex items-center gap-2">🛵 อันดับกำไรเดลิเวอรี่</h3>
      <div class="space-y-2">
        ${delivRank.map((p, i) => {
          const maxP = Math.max(Math.abs(delivRank[0].actualDelivProfit), 1);
          const pct = (Math.abs(p.actualDelivProfit) / maxP * 100);
          
          const priceDelivNum = Number(p.priceDelivery) || 0;
          // ปรับปรุง: คำนวณ % ต้นทุน และ % กำไร โดยเทียบสัดส่วนจากราคาตั้งเดลิเวอรี่เต็มจำนวน เพื่อให้ตรงกับหน้าการ์ดสินค้า
          const costPct = priceDelivNum > 0 ? (p.cost / priceDelivNum * 100) : 0;
          const profitPct = priceDelivNum > 0 ? (p.actualDelivProfit / priceDelivNum * 100) : 0;
          
          return `
          <div class="flex items-center gap-3">
            <span class="text-lg w-8 text-center">${i < 3 ? medals[i] : (i + 1)}</span>
            <div class="flex-1">
              <div class="flex justify-between text-sm mb-0.5">
                <span class="font-medium text-gray-700">${p.name}</span>
                <span class="${p.actualDelivProfit >= 0 ? 'text-sky-600' : 'text-red-500'} font-bold">฿${fmt(p.actualDelivProfit)}</span>
              </div>
              <div class="text-xs text-gray-400 mb-1">ต้นทุน ${costPct.toFixed(1)}% | กำไรสุทธิ ${profitPct.toFixed(1)}% | ราคา ฿${fmt(priceDelivNum)} → สุทธิหลังหัก GP ฿${fmt(p.delivNet)}</div>
              <div class="w-full bg-gray-100 rounded-full h-2">
                <div class="h-2 rounded-full transition-all duration-700 ${p.actualDelivProfit >= 0 ? 'bg-gradient-to-r from-sky-300 to-sky-500' : 'bg-red-400'}" style="width:${Math.max(pct, 5)}%"></div>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="bg-amber-50 rounded-2xl p-4 border border-amber-200">
      <h4 class="font-semibold text-amber-700 text-sm mb-1">💡 วิธีคำนวณเดลิเวอรี่</h4>
      <p class="text-xs text-amber-600 leading-relaxed">
        ราคาเดลิเวอรี่ - GP 30% - VAT 7% ของ GP = ยอดสุทธิที่ได้รับหลังหัก GP จากนั้นนำมาหักลบต้นทุนวัตถุดิบจริงเพื่อคิดกำไรสุทธิเดลิเวอรี่<br>
        <strong>สูตรยอดรับสุทธิ:</strong> สุทธิ = ราคา × (1 - 0.30 - 0.30×0.07) = ราคา × 0.679
      </p>
    </div>
  </div>`;
}
